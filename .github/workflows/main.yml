name: Auto Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE
      run: |
        # specファイルを使わず、メインプログラムから直接安全にビルドします
        pyinstaller --onefile --noconsole src/ScreenMind_v4.1_AutoBuild_Final.py --name ScreenMind

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenMind-Windows
        path: dist/
