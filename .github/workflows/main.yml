name: Auto Build

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      shell: pwsh
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # requirements.txtがどこにあっても自動で探してインストールします
        $req = Get-ChildItem -Path . -Recurse -Filter requirements.txt | Select-Object -First 1
        if ($req) { pip install -r "$($req.FullName)" }

    - name: Build EXE
      shell: pwsh
      run: |
        # Pythonファイルがどこにあっても自動で探し出してビルドします
        $files = Get-ChildItem -Path . -Recurse -Filter *.py
        $target = $files | Where-Object { $_.Name -match "ScreenMind|main" } | Select-Object -First 1
        if (-not $target) { $target = $files | Select-Object -First 1 }
        
        pyinstaller --onefile --noconsole "$($target.FullName)" --name ScreenMind

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ScreenMind-Windows
        path: dist/
